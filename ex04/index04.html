<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
</head>
<body>
  <h1>Create an Account</h1>
  <form action="#" method="post">
    <p>
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" required minlength="2">
    </p>

    <p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8">
    </p>

      <p>Preferred learning format</p>
      <input type="radio" id="self-paced" name="learning-format" value="self-paced" required>
      <label for="self-paced">Self-paced</label>
      <input type="radio" id="group" name="learning-format" value="group">
      <label for="group">Group learning</label>

    <p>
      <label for="experience">Programming experience</label>
      <select id="experience" name="experience" required>
        <option value="" selected disabled>Select an option</option>
        <option value="beginner">Beginner</option>
        <option value="some">Some experience</option>
        <option value="experienced">Experienced</option>
      </select>
    </p>

    <p>
      <label for="about">Tell us about your goals</label>
      <textarea id="about" name="about" rows="5" cols="35" required minlength="10"></textarea>
    </p>

    <p>
      <input type="checkbox" id="agreement" name="agreement" required>
      <label for="agreement">I agree to the registration terms.</label>
    </p>

    <button type="submit">Register</button>
  </form>
</body>
</html>
